domain: MCInstallationErrorDomain
code: 4000
symbol: inCannotParseProfile
title: Invalid profile
summary: >-
  The device refused to queue a profile for installation because it judged the
  profile invalid. Devices show it as "Invalid Profile". It is an outer error:
  the next error in the chain, usually MCProfileErrorDomain 1000, carries the
  actual reason.
causes:
  - A required key is missing from a payload, for example an MDM payload with no IdentityCertificateUUID.
  - The profile data can't be read as a valid profile.
checks:
  - Read the next error in the ErrorChain. Its suggestion text often names the missing or invalid field.
  - Check every payload against Apple's payload reference for required keys. In an MDM payload, IdentityCertificateUUID must point to a certificate or SCEP payload in the same profile.
platforms: [iOS]
confidence: observed
last_confirmed: "iOS 14.4.2"
