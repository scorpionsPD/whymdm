domain: MCProfileErrorDomain
code: 1000
symbol: prMalformedProfile
title: Invalid profile
summary: >-
  The device rejected the profile as invalid. Devices show "Invalid Profile"
  for many different problems, so the suggestion text in the same error, or
  the next error in the chain, matters more than the code. Apple Configurator
  shows it as MCProfileErrorDomain 0x3E8 (1000).
causes:
  - A required key is missing, for example Topic or IdentityCertificateUUID in an MDM payload.
  - The profile couldn't be parsed. One report saw this when sending a signed profile with InstallProfile while the unsigned copy installed.
  - The profile breaks a structural rule, for example a profile with an MDM payload was made non-removable with a removal password payload.
  - During Automated Device Enrollment or Apple Configurator preparation, the device isn't assigned to the right MDM server or enrollment profile.
  - The user assigned to the device can't be found, for example because they aren't in a valid Apple School Manager group.
  - On the certificate side, a broken Network Device Enrollment Service (SCEP) installation, in one vendor's case.
checks:
  - Read the suggestion text (USEnglishDescription, or the next item in the chain). It often names the field.
  - Compare the profile with Apple's payload reference. In an MDM payload, Topic must match the topic of your push certificate, and IdentityCertificateUUID must point to a certificate or SCEP payload in the same profile.
  - For enrollment through Apple School Manager or Apple Business, check that the device is assigned to the correct MDM server and enrollment profile, then erase and prepare it again.
platforms: [iOS, iPadOS]
confidence: observed
