domain: MCProfileErrorDomain
code: 1009
symbol: prProfileInstallationFailure
title: Profile could not be installed
summary: >-
  The profile as a whole failed to install and the device rolled back its
  changes. The device's message names the profile. It wraps the payload-level
  error that caused the failure, so look further down the chain for the reason.
causes:
  - During enrollment, the SCEP server returned an invalid response while issuing the device's identity certificate.
  - During enrollment, the MDM server demanded a TLS client certificate.
  - An Exchange ActiveSync payload couldn't retrieve the server's policy (MCEASErrorDomain 21001).
  - Another payload in the profile failed with its own error, for example a cellular private network payload.
checks:
  - Find the innermost error in the chain and fix that payload, or the server it depends on.
  - For enrollment failures, test the SCEP and MDM server URLs from the device's network and check their TLS settings.
platforms: [iOS]
confidence: observed
